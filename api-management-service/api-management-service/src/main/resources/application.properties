spring.application.name=api-management-service
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/gatekeeper_management
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

info.app.name=API Management Service
info.app.description=Management service for users, routes and gateway policies

security.jwt.expiration-seconds=3600
security.jwt.secret=${jwt_secret}